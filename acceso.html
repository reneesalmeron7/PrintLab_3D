<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrintLab 3D — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/styles.css">
</head>
<body class="auth-page">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="nav scrolled">
    <a class="brand" href="index.html">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <path d="M6 22 L16 27 L26 22 L16 17 Z" fill="#0D9488"/>
          <path d="M6 16 L16 21 L26 16 L16 11 Z" fill="#4F46E5"/>
          <path d="M6 10 L16 15 L26 10 L16 5 Z" fill="#F6F3EC"/>
        </svg>
      </span>
      <span>PrintLab <em>3D</em></span>
    </a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
      <span class="sr">Menú</span>
    </button>
    <nav class="menu" id="menu" aria-label="Navegación principal">
      <a href="index.html#catalogo">Catálogo</a>
      <a href="index.html#materiales">Materiales</a>
      <a href="index.html#personalizada">Impresión personalizada</a>
      <span id="sessionSlot" class="session-slot"></span>
      <a class="ghost" id="enterLink" href="acceso.html">Entrar</a>
      <a class="solid" id="registerLink" href="acceso.html#registro">Crear cuenta</a>
    </nav>
  </header>

  <main class="auth" id="contenido" tabindex="-1">
    <div class="auth-intro">
      <p class="eyebrow dark">Tu cuenta</p>
      <h1>Entra o regístrate.</h1>
    </div>

    <div class="sheet compact auth-card">
      <div class="switch" role="tablist" aria-label="Entrar o crear cuenta">
        <button type="button" id="showLogin" class="on" role="tab" aria-selected="true" aria-controls="loginPanel">Entrar</button>
        <button type="button" id="showRegister" role="tab" aria-selected="false" aria-controls="registerPanel" tabindex="-1">Crear cuenta</button>
      </div>

      <div role="tabpanel" id="loginPanel" aria-labelledby="showLogin">
        <form id="loginForm">
          <label>Usuario
            <input name="usuario" required autocomplete="username" placeholder="tu.usuario">
          </label>
          <label>Contraseña
            <input name="clave" type="password" required autocomplete="current-password" placeholder="••••••••">
          </label>
          <button class="solid full" type="submit">Continuar</button>
          <p class="form-note" id="loginNote" role="status"></p>
        </form>
      </div>

      <div role="tabpanel" id="registerPanel" aria-labelledby="showRegister" hidden>
        <form id="registro">
          <label>Usuario
            <input name="usuario" required autocomplete="username" placeholder="tu.usuario">
          </label>
          <label>Correo
            <input name="email" type="email" required autocomplete="email" placeholder="tu@correo.com">
          </label>
          <label>Contraseña
            <input name="clave" type="password" required autocomplete="new-password" placeholder="••••••••">
          </label>
          <button class="solid full" type="submit">Crear cuenta</button>
          <p class="form-note" id="registerNote" role="status"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="public/menu.js"></script>
  <script src="public/store.js"></script>
  <script src="public/acceso.js"></script>
</body>
</html>
