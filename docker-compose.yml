services:
  db:
    image: mariadb:11.4
    container_name: printlab_db
    restart: always
    mem_limit: 512m
    cpus: "1.0"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_ROOT_HOST: "localhost"
      MARIADB_DATABASE: printlab3d
      MARIADB_USER: printlab_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-printlab_pass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - printlab_net

volumes:
  db_data:

networks:
  printlab_net:
    driver: bridge
