version: '3.8'

services:
  db:
    image: mariadb:11.4
    container_name: printlab_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: printlab3d
      MARIADB_USER: printlab_user
      MARIADB_PASSWORD: printlab_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - printlab_net

volumes:
  db_data:

networks:
  printlab_net:
    driver: bridge